<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/theme-unified.css">
    <link rel="stylesheet" href="/static/css/admin-common.css">
    <style>
        .password-card {
            max-width: 500px;
            margin: 2rem auto;
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .password-input-wrapper {
            position: relative;
        }
        
        .password-input-wrapper input {
            padding-right: 3rem;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #718096;
            font-size: 1.1rem;
        }
        .password-toggle:hover { color: #1e3c72; }
        
        .strength-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }
        .strength-weak { background: #e74c3c; width: 33%; }
        .strength-medium { background: #f39c12; width: 66%; }
        .strength-strong { background: #2ecc71; width: 100%; }
    </style>
</head>
<body>
    {% include 'includes/admin_nav.html' %}
    
    <div class="admin-container">
        <div class="password-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 3rem;">🔐</div>
                <h2 style="color: #2d3748; margin-top: 0.5rem;">Change Password</h2>
                <p style="color: #718096;">Update your admin password</p>
            </div>
            
            {% if error %}
            <div class="admin-message admin-message-error">{{ error }}</div>
            {% endif %}
            
            {% if success %}
            <div class="admin-message admin-message-success">{{ success }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="admin-form-group">
                    <label>Current Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="current_password" name="current_password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('current_password')">
                            <i class="fas fa-eye" id="current_password-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="admin-form-group">
                    <label>New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="new_password" name="new_password" required
                               oninput="checkStrength(this.value)">
                        <button type="button" class="password-toggle" onclick="togglePassword('new_password')">
                            <i class="fas fa-eye" id="new_password-icon"></i>
                        </button>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthBar"></div>
                    </div>
                    <div id="strengthText" style="font-size: 0.8rem; margin-top: 0.5rem;"></div>
                </div>
                
                <div class="admin-form-group">
                    <label>Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirm_password')">
                            <i class="fas fa-eye" id="confirm_password-icon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="admin-btn admin-btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; justify-content: center;">
                    <i class="fas fa-save"></i> Update Password
                </button>
            </form>
        </div>
    </div>
    
    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById(id + '-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        function checkStrength(password) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            bar.className = 'strength-fill';
            text.textContent = '';
            
            if (password.length === 0) return;
            
            if (strength <= 2) {
                bar.classList.add('strength-weak');
                text.textContent = '⚠️ Weak password';
                text.style.color = '#e74c3c';
            } else if (strength <= 3) {
                bar.classList.add('strength-medium');
                text.textContent = '📊 Medium password';
                text.style.color = '#f39c12';
            } else {
                bar.classList.add('strength-strong');
                text.textContent = '✅ Strong password';
                text.style.color = '#2ecc71';
            }
        }
    </script>
    
    <script src="/static/js/theme-manager.js"></script>
</body>
</html>
