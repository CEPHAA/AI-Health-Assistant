<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | AI Health Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo h2 {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
        }
        
        .doctor-badge {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .stat-info h3 {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 0.5rem;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3748;
        }
        
        .patients-section {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .search-box input {
            padding: 0.5rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            width: 250px;
        }
        
        .patient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }
        
        .patient-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
        }
        
        .patient-card:hover {
            border-color: #1e3c72;
            transform: translateX(5px);
        }
        
        .patient-card.selected {
            background: linear-gradient(135deg, rgba(30,60,114,0.1), rgba(42,82,152,0.1));
            border-color: #1e3c72;
        }
        
        .patient-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .patient-name {
            font-weight: 700;
            color: #2d3748;
        }
        
        .patient-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        
        .status-new {
            background: #fed7d7;
            color: #c53030;
        }
        
        .status-reviewed {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .report-section {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            display: none;
        }
        
        .report-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .ai-report, .doctor-review {
            background: #f7fafc;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .ai-badge {
            display: inline-block;
            background: #e9d8fd;
            color: #6b46c1;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
        
        .review-form textarea, .review-form input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .patient-grid {
                grid-template-columns: 1fr;
            }
            .search-box input {
                width: 150px;
            }
            .nav-content {
                flex-direction: column;
                gap: 1rem;
            }
            .container {
                padding: 1rem;
            }
        }
    </style>
<link rel="stylesheet" href="/static/css/theme-unified.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <h2>🏥 AI Health Assistant - Doctor Portal</h2>
            </div>
            <div class="nav-links">
                <span class="doctor-badge"><i class="fas fa-user-md"></i> Dr. {{ name }}</span>
                <a href="/doctor/dashboard">Dashboard</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <h3>Total Patients</h3>
                    <div class="stat-number" id="totalPatients">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                <div class="stat-info">
                    <h3>Pending Reports</h3>
                    <div class="stat-number" id="pendingReports">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <h3>Reviewed Reports</h3>
                    <div class="stat-number" id="reviewedReports">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-prescription-bottle"></i></div>
                <div class="stat-info">
                    <h3>Prescriptions</h3>
                    <div class="stat-number" id="prescriptions">0</div>
                </div>
            </div>
        </div>

        <div class="patients-section">
            <div class="section-header">
                <h3><i class="fas fa-users"></i> My Patients</h3>
                <div class="search-box">
                    <input type="text" id="searchPatient" placeholder="Search patient..." onkeyup="filterPatients()">
                </div>
            </div>
            <div class="patient-grid" id="patientGrid">
                <p>Loading patients...</p>
            </div>
        </div>

        <div class="report-section" id="reportSection">
            <div class="report-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2><i class="fas fa-file-medical"></i> AI Health Report</h2>
                <button class="btn-secondary" onclick="closeReport()">Close</button>
            </div>
            <div id="reportContent"></div>
        </div>
    </div>

    <script>
        let currentPatientId = null;
        let patientsData = [];

        function loadStats() {
            fetch('/api/doctor/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('totalPatients').textContent = data.total_patients || 0;
                    document.getElementById('pendingReports').textContent = data.pending_reports || 0;
                    document.getElementById('reviewedReports').textContent = data.reviewed_reports || 0;
                    document.getElementById('prescriptions').textContent = data.prescriptions || 0;
                })
                .catch(err => console.error('Error loading stats:', err));
        }

        function loadPatients() {
            fetch('/api/doctor/patients')
                .then(res => res.json())
                .then(data => {
                    patientsData = data.patients || [];
                    displayPatients(patientsData);
                })
                .catch(err => console.error('Error loading patients:', err));
        }

        function displayPatients(patients) {
            const grid = document.getElementById('patientGrid');
            if (!patients || patients.length === 0) {
                grid.innerHTML = '<p>No patients assigned yet.</p>';
                return;
            }
            
            grid.innerHTML = '';
            patients.forEach(patient => {
                const card = document.createElement('div');
                card.className = `patient-card ${currentPatientId === patient.id ? 'selected' : ''}`;
                card.onclick = () => loadPatientReport(patient.id);
                card.innerHTML = `
                    <div class="patient-header">
                        <span class="patient-name">${escapeHtml(patient.name)}</span>
                        <span class="patient-status ${patient.has_unread ? 'status-new' : 'status-reviewed'}">
                            ${patient.has_unread ? 'New Report' : 'Reviewed'}
                        </span>
                    </div>
                    <div style="font-size: 0.8rem; color: #718096;">
                        <i class="fas fa-notes-medical"></i> ${patient.reports_count || 0} reports
                    </div>
                    <div style="font-size: 0.8rem; color: #718096; margin-top: 0.25rem;">
                        <i class="fas fa-calendar"></i> Last: ${patient.last_report ? patient.last_report.slice(0,10) : 'No reports'}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterPatients() {
            const searchTerm = document.getElementById('searchPatient').value.toLowerCase();
            const filtered = patientsData.filter(p => 
                p.name.toLowerCase().includes(searchTerm) ||
                p.email.toLowerCase().includes(searchTerm)
            );
            displayPatients(filtered);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadPatientReport(patientId) {
            currentPatientId = patientId;
            displayPatients(patientsData);
            
            fetch(`/api/doctor/patient/${patientId}/reports`)
                .then(res => res.json())
                .then(data => {
                    const reportSection = document.getElementById('reportSection');
                    const reportContent = document.getElementById('reportContent');
                    
                    reportContent.innerHTML = `
                        <div class="ai-report">
                            <div class="ai-badge"><i class="fas fa-robot"></i> AI Analysis Report</div>
                            <h3>${escapeHtml(data.patient?.name || 'Patient')}</h3>
                            <p><strong>Email:</strong> ${escapeHtml(data.patient?.email || 'N/A')}</p>
                            ${data.reports && data.reports.length > 0 ? data.reports.map(report => `
                                <div style="border-left: 3px solid #1e3c72; padding: 1rem; margin: 1rem 0; background: white; border-radius: 10px;">
                                    <div style="display: flex; justify-content: space-between;">
                                        <strong>📅 ${report.date ? report.date.slice(0,10) : 'Unknown'}</strong>
                                        <span style="padding: 0.25rem 0.75rem; border-radius: 20px; background: ${report.severity === 'Mild' ? '#c6f6d5' : report.severity === 'Moderate' ? '#feebc8' : '#fed7d7'}">${report.severity || 'Unknown'}</span>
                                    </div>
                                    <p><strong>Symptoms:</strong> ${escapeHtml(report.symptoms || '')}</p>
                                    <p><strong>AI Prediction:</strong> ${escapeHtml(report.prediction || '')}</p>
                                    <p><strong>Confidence:</strong> ${report.confidence || 0}%</p>
                                    <p><strong>AI Advice:</strong> ${escapeHtml(report.advice || '')}</p>
                                    ${report.doctor_review ? `
                                        <div style="background: #e8f5e9; padding: 0.75rem; border-radius: 10px; margin-top: 0.5rem;">
                                            <strong><i class="fas fa-stethoscope"></i> Doctor's Review:</strong><br>
                                            <strong>Confirmed:</strong> ${escapeHtml(report.doctor_review.confirmed_diagnosis || '')}<br>
                                            <strong>Notes:</strong> ${escapeHtml(report.doctor_review.notes || '')}<br>
                                            <strong>Prescription:</strong> ${escapeHtml(report.doctor_review.prescription || '')}
                                        </div>
                                    ` : `
                                        <div class="review-form" style="margin-top: 1rem;">
                                            <h5>Add Your Review</h5>
                                            <input type="text" id="diagnosis_${report.id}" placeholder="Confirmed Diagnosis" style="width:100%; padding:0.5rem; margin-bottom:0.5rem;">
                                            <textarea id="notes_${report.id}" rows="2" placeholder="Doctor's Notes" style="width:100%; padding:0.5rem; margin-bottom:0.5rem;"></textarea>
                                            <textarea id="prescription_${report.id}" rows="2" placeholder="Prescription" style="width:100%; padding:0.5rem; margin-bottom:0.5rem;"></textarea>
                                            <button class="btn-primary" onclick="submitReview(${report.id})">Submit Review</button>
                                        </div>
                                    `}
                                </div>
                            `).join('') : '<p style="text-align: center; padding: 2rem;">No AI reports yet for this patient.</p>'}
                        </div>
                    `;
                    
                    reportSection.classList.add('active');
                    reportSection.scrollIntoView({ behavior: 'smooth' });
                })
                .catch(err => {
                    console.error('Error loading report:', err);
                    alert('Error loading patient report');
                });
        }

        function submitReview(recordId) {
            const diagnosis = document.getElementById(`diagnosis_${recordId}`).value;
            const notes = document.getElementById(`notes_${recordId}`).value;
            const prescription = document.getElementById(`prescription_${recordId}`).value;
            
            fetch('/api/doctor/review', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    record_id: recordId,
                    diagnosis: diagnosis,
                    notes: notes,
                    prescription: prescription
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Review submitted successfully!');
                    loadPatientReport(currentPatientId);
                    loadStats();
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(err => {
                console.error('Error submitting review:', err);
                alert('Error submitting review');
            });
        }

        function closeReport() {
            document.getElementById('reportSection').classList.remove('active');
            currentPatientId = null;
            displayPatients(patientsData);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadPatients();
        });
    </script>
<script src="/static/js/theme-manager.js"></script>
</body>
</html>
