<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot | Health Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h2>🏥 AI Health Assistant</h2>
            </div>
            <div class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/symptom_checker">Symptom Checker</a>
                <a href="/chatbot" class="active">AI Chatbot</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="chatbot-container">
                <div class="chatbot-header">
                    <div class="bot-status">
                        <span class="status-dot"></span>
                        <h2>AI Health Assistant</h2>
                    </div>
                    <p>Ask me anything about your health</p>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="message bot">
                        <div class="message-content">
                            Hello! I'm your AI health assistant. How can I help you today? 
                            You can ask me about symptoms, health tips, or general medical questions.
                        </div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off">
                    <button id="sendBtn" class="btn-primary">Send</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(message, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            messageDiv.innerHTML = `<div class="message-content">${message}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            fetch('/api/chatbot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                addMessage(data.response, false);
            })
            .catch(error => {
                console.error('Error:', error);
                addMessage("I'm having trouble connecting. Please try again.", false);
            });
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
